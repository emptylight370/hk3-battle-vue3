# .cnb.yml — 云原生开发「仅预览模式」配置
# 文档: https://docs.cnb.cool/zh/workspaces/only-preview.html
$:
  vscode:
    - docker:
        image: node:24
      services:
        - name: vscode
          options:
            # 启用仅预览模式：点击按钮跳过 WebIDE，直接打开业务预览页
            onlyPreview: true
            # 依赖已由下面 stages 的 setup 阶段装好，这里只负责起服务，不再串安装命令
            # - --host 0.0.0.0：监听全部网卡，平台才能从容器外探测到 8686
            # - 预览域名白名单在 vite.config.ts 的 server.allowedHosts 里配置
            launch: npm i -g pnpm && pnpm install --frozen-lockfile && pnpm exec vite --port 8686 --host 0.0.0.0 --strictPort
            # vite 以后台进程形式常驻，launch 不会自行退出，必须开 daemon
            daemon: true
            # 关闭页面后退出时间
            keepAliveTimeout: 30s
